name: Custom Build

on:
  push:
    branches:
      - custom
  pull_request:
    branches:
      - custom
  workflow_dispatch:

env:
  GO111MODULE: on

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          stable: true
          cache: true

      - name: Build main binary
        run: go build -ldflags "-s -w" -tags=nomsgpack -o axonhub ./cmd/axonhub

      - name: Build schema generator
        run: cd cmd/schema && go build -o schema

      - name: Build llm module packages
        run: cd llm && go build ./...

      - name: Verify all packages compile
        run: go build ./...

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: axonhub-backend-${{ github.sha }}
          path: |
            axonhub
            cmd/schema/schema

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: axonhub-frontend-${{ github.sha }}
          path: frontend/dist
