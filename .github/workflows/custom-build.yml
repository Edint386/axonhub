name: Custom Build

on:
  push:
    branches:
      - custom
  pull_request:
    branches:
      - custom
  workflow_dispatch:

permissions:
  contents: read

env:
  GO111MODULE: on
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-linux-amd64:
    name: Build Linux AMD64 Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Embed frontend assets
        run: |
          rm -rf internal/server/static/dist/assets
          mkdir -p internal/server/static/dist
          cp -r frontend/dist/* internal/server/static/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          stable: true
          cache: true

      - name: Build AxonHub binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -tags=nomsgpack \
            -ldflags "-s -w -X github.com/looplj/axonhub/internal/build.Commit=${{ github.sha }} -X github.com/looplj/axonhub/internal/build.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o axonhub \
            ./cmd/axonhub

      - name: Prepare package
        run: |
          mkdir -p package
          cp axonhub package/
          cp config.example.yml package/
          cp LICENSE package/
          cp README.md package/
          chmod +x package/axonhub

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: axonhub-linux-amd64-${{ github.sha }}
          path: package
